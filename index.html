<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoviePro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b10;
    --surface: #0e1520;
    --card: #131926;
    --border: #1e2d42;
    --accent: #e8a020;
    --text: #e8edf5;
    --muted: #6b7a93;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,11,16,0.97);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 5vw;
    display: flex; align-items: center;
    height: 64px; gap: 20px;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; letter-spacing: 3px; color: var(--accent); flex-shrink: 0; }
  .logo span { color: var(--text); }

  .filters {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0;
    scrollbar-width: none; flex: 1;
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); padding: 7px 16px; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

  main { padding: 28px 5vw; }

  .status { text-align: center; padding: 80px 20px; color: var(--muted); }
  .spinner {
    display: inline-block; width: 36px; height: 36px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-label {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem;
    letter-spacing: 3px; color: var(--muted);
    margin-bottom: 20px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-label span { color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; cursor: pointer;
    transition: transform 0.25s, border-color 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.35s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 14px 40px rgba(0,0,0,0.5); }
  .card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: var(--surface); display: block; }
  .card-body { padding: 11px; }
  .card-title {
    font-size: 0.86rem; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta { margin-top: 6px; display: flex; align-items: center; justify-content: space-between; font-size: 0.76rem; color: var(--muted); }
  .badge { font-size: 0.67rem; padding: 2px 7px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
  .badge-movie { background: rgba(232,160,32,0.12); color: var(--accent); border: 1px solid rgba(232,160,32,0.25); }
  .badge-series { background: rgba(80,160,255,0.1); color: #70b0ff; border: 1px solid rgba(80,160,255,0.2); }
  .rating { color: var(--accent); font-weight: 700; }

  /* Modal */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.88); backdrop-filter: blur(10px);
    z-index: 200; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; max-width: 700px; width: 100%;
    max-height: 90vh; overflow-y: auto; position: relative;
    animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes modalIn { from { opacity:0; transform:scale(0.88); } to { opacity:1; transform:scale(1); } }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center; z-index: 10;
    transition: background 0.2s;
  }
  .modal-close:hover { background: var(--border); }
  .modal-top { display: flex; gap: 22px; padding: 24px; }
  .modal-poster { width: 150px; flex-shrink: 0; border-radius: 8px; overflow: hidden; }
  .modal-poster img { width: 100%; display: block; }
  .modal-info { flex: 1; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 2px; line-height: 1.1; margin-bottom: 8px; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .tag { font-size: 0.73rem; padding: 3px 10px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
  .modal-desc { font-size: 0.88rem; color: #b0bcc8; line-height: 1.6; margin-bottom: 14px; }
  .modal-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.81rem; color: var(--muted); }
  .modal-stats strong { color: var(--text); }
  .cast-section { padding: 0 24px 14px; }
  .cast-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
  .cast-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .cast-card { flex-shrink: 0; text-align: center; width: 70px; }
  .cast-card img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); display: block; margin: 0 auto 5px; }
  .cast-card .cn { font-size: 0.68rem; color: var(--text); line-height: 1.2; }
  .cast-card .cc { font-size: 0.63rem; color: var(--muted); }
  .dl-section { padding: 14px 24px 24px; }
  .dl-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
  .dl-list { display: flex; flex-direction: column; gap: 8px; }
  .dl-btn {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; color: var(--text); text-decoration: none;
    font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .dl-btn:hover { border-color: var(--accent); background: rgba(232,160,32,0.07); transform: translateX(4px); }
  .dl-q { font-weight: 700; font-size: 1rem; color: var(--accent); }
  .dl-s { color: var(--muted); font-size: 0.8rem; }
  .modal-loading { text-align: center; padding: 50px; color: var(--muted); }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 520px) {
    .modal-top { flex-direction: column; }
    .modal-poster { width: 110px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    header { flex-wrap: wrap; height: auto; padding: 10px 4vw; gap: 10px; }
    .filters { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">MOVIE<span>PRO</span></div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('movie',this)">🎬 Movies</button>
    <button class="filter-btn" onclick="setFilter('series',this)">📺 Series</button>
    <button class="filter-btn" onclick="setFilter('top',this)">⭐ Top Rated</button>
    <button class="filter-btn" onclick="setFilter('2026',this)">🆕 2026</button>
    <button class="filter-btn" onclick="setFilter('2025',this)">2025</button>
    <button class="filter-btn" onclick="setFilter('hindi',this)">🇮🇳 Hindi</button>
  </div>
</header>

<main>
  <div id="content">
    <div class="status"><div class="spinner"></div><br>Loading movies...</div>
  </div>
</main>

<div class="modal-bg" id="modalBg" onclick="closeBg(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
let allMovies = [];
let currentFilter = 'all';

const QUERIES = ['action','adventure','comedy','drama','horror','animation','hindi','2026','2025','marvel','disney','thriller'];

async function loadAll() {
  const seen = new Set();
  const results = [];

  for (const q of QUERIES) {
    try {
      const res = await fetch(`/api/search?query=${encodeURIComponent(q)}`);
      const json = await res.json();
      if (json.status && json.data) {
        for (const item of json.data) {
          if (!seen.has(item.id)) {
            seen.add(item.id);
            results.push(item);
          }
        }
      }
    } catch(e) {}
    document.getElementById('content').innerHTML =
      `<div class="status"><div class="spinner"></div><br>Loading... <span style="color:var(--accent)">${results.length}</span> movies found</div>`;
  }

  allMovies = results;
  renderFiltered();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFiltered();
}

function renderFiltered() {
  let items = [...allMovies];
  if (currentFilter === 'movie')  items = items.filter(i => i.type === 1);
  else if (currentFilter === 'series') items = items.filter(i => i.type === 2);
  else if (currentFilter === 'top')    items = items.filter(i => i.rating >= 7.5).sort((a,b) => b.rating - a.rating);
  else if (currentFilter === '2026')   items = items.filter(i => i.date?.startsWith('2026'));
  else if (currentFilter === '2025')   items = items.filter(i => i.date?.startsWith('2025'));
  else if (currentFilter === 'hindi')  items = items.filter(i => i.title.toLowerCase().includes('hindi'));

  if (items.length === 0) {
    document.getElementById('content').innerHTML = `<div class="status">😕 No results.</div>`;
    return;
  }

  const labels = {all:'All',movie:'Movies',series:'Series',top:'Top Rated','2026':'New 2026','2025':'From 2025',hindi:'Hindi'};
  const cards = items.map((item, i) => {
    const isMovie = item.type === 1;
    const year = item.date ? item.date.slice(0,4) : '';
    const delay = Math.min(i * 0.025, 0.5);
    return `<div class="card" style="animation-delay:${delay}s" onclick="openModal('${item.id}')">
      <img class="card-img" src="${item.image}" alt="" loading="lazy" onerror="this.style.background='#1e2d42'">
      <div class="card-body">
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <span class="badge ${isMovie?'badge-movie':'badge-series'}">${isMovie?'Movie':'Series'}</span>
          <span class="rating">★ ${item.rating||'—'}</span>
        </div>
        <div class="card-meta" style="margin-top:4px"><span>${year}</span><span>${item.country||''}</span></div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="section-label"><span>${items.length}</span> ${labels[currentFilter]||'Results'}</div>
    <div class="grid">${cards}</div>
  `;
}

async function openModal(id) {
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalContent').innerHTML = `<div class="modal-loading"><div class="spinner"></div><br>Loading...</div>`;
  try {
    const res = await fetch(`/api/info?id=${id}`);
    const json = await res.json();
    if (!json.status || !json.data) { document.getElementById('modalContent').innerHTML = `<div class="modal-loading">Failed to load.</div>`; return; }
    renderModal(json.data);
  } catch(e) {
    document.getElementById('modalContent').innerHTML = `<div class="modal-loading">⚠️ Error.</div>`;
  }
}

function renderModal(d) {
  const genres = (d.genre||[]).map(g=>`<span class="tag">${g}</span>`).join('');
  const year = d.year || (d.date?d.date.slice(0,4):'—');
  const langs = (d.language||[]).join(', ') || '—';

  const castHTML = (d.cast||[]).length > 0 ? `<div class="cast-section">
    <div class="cast-title">CAST</div>
    <div class="cast-list">${d.cast.map(c=>`
      <div class="cast-card">
        <img src="${c.url}" alt="${c.name}" onerror="this.style.display='none'">
        <div class="cn">${c.name}</div><div class="cc">${c.character}</div>
      </div>`).join('')}</div></div>` : '';

  const dlHTML = (d.download||[]).length > 0 ? `<div class="dl-section">
    <div class="dl-title">DOWNLOAD</div>
    <div class="dl-list">${d.download.map(dl=>`
      <a class="dl-btn" href="${dl.link}" target="_blank">
        <div><span class="dl-q">${dl.quality}</span> <span class="dl-s">· ${dl.size}</span></div>
        <span style="color:var(--accent)">↓ Download</span>
      </a>`).join('')}</div></div>`
    : '<div style="padding:0 24px 20px;color:var(--muted);font-size:0.85rem;">No download links.</div>';

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-top">
      <div class="modal-poster"><img src="${d.image}" alt="${d.title}"></div>
      <div class="modal-info">
        <div class="modal-title">${d.title}</div>
        <div class="modal-tags">${genres}</div>
        ${d.description?`<div class="modal-desc">${d.description}</div>`:''}
        <div class="modal-stats">
          <span>⭐ <strong>${d.rating||'—'}</strong></span>
          <span>📅 <strong>${year}</strong></span>
          <span>🌐 <strong>${langs}</strong></span>
          <span>🏳️ <strong>${d.country||'—'}</strong></span>
        </div>
      </div>
    </div>${castHTML}${dlHTML}`;
}

function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
function closeBg(e) { if(e.target===document.getElementById('modalBg')) closeModal(); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

loadAll();
</script>
</body>
</html>
