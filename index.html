<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEFLIX</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white;}
header{background:#e50914;padding:15px;text-align:center;font-size:28px;font-weight:bold;}

.search-box{text-align:center;padding:20px;}
input{padding:12px;width:70%;border:none;border-radius:8px;}
button{padding:12px 15px;background:#e50914;border:none;color:white;border-radius:8px;cursor:pointer;}

.movies{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;padding:20px;}

.card{background:#1a1a1a;border-radius:10px;overflow:hidden;cursor:pointer;}
.card img{width:100%;height:260px;object-fit:cover;}
.card div{padding:10px;}
</style>
</head>

<body>

<header>CINEFLIX</header>

<div class="search-box">
<input id="searchInput" placeholder="Search movie...">
<button onclick="searchMovies()">Search</button>
</div>

<div class="movies" id="movies"></div>

<script>

const API_KEY = "646eae85127d7d99";

// 🔥 IMPORTANT FIX: async + proper function
async function searchMovies(){

const q = document.getElementById("searchInput").value;

if(!q){
alert("Type something first!");
return;
}

const url = `https://api-dark-shan-yt.koyeb.app/movie/moviepro-search?q=${encodeURIComponent(q)}&apikey=${API_KEY}`;

console.log("API URL:", url);

try{

const res = await fetch(url);
const data = await res.json();

console.log(data);

const container = document.getElementById("movies");
container.innerHTML = "";

data.data.forEach(movie=>{

container.innerHTML += `
<div class="card" onclick="openMovie('${movie.id}')">
<img src="${movie.image}">
<div>
<h3>${movie.title}</h3>
<p>⭐ ${movie.rating}</p>
<p>${movie.country}</p>
</div>
</div>
`;

});

}catch(err){
console.log("ERROR:",err);
alert("API error / CORS issue");
}

}

async function openMovie(id){
alert("Detail API ready (next step we connect)");
}

</script>

</body>
</html>
