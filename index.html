<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shan Movie Zone</title>
    <!-- Tailwind CSS for Beautiful Styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .movie-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 px-4 py-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black tracking-wider text-red-500 flex items-center gap-2">
                <i class="fa-solid fa-film"></i> SHAN MOVIE ZONE
            </h1>
            <!-- Search Bar -->
            <div class="w-full sm:w-96 flex bg-gray-800 rounded-full overflow-hidden border border-gray-700 focus-within:border-red-500 transition">
                <input type="text" id="searchInput" placeholder="Search movies..." class="w-full bg-transparent px-4 py-2 outline-none text-sm text-gray-200">
                <button onclick="searchMovies()" class="bg-red-600 hover:bg-red-700 px-6 text-sm font-semibold transition cursor-pointer">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Loading Spinner -->
        <div id="loader" class="hidden flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-red-500"></div>
        </div>

        <!-- Movie Details View (Hidden by default) -->
        <section id="movieDetails" class="hidden bg-gray-900 rounded-2xl p-6 mb-10 border border-gray-800 shadow-2xl animate-fade-in"></section>

        <!-- Movie Grid Title -->
        <h2 id="gridTitle" class="text-xl font-bold mb-6 text-gray-400 border-l-4 border-red-500 pl-3">Trending Movies</h2>

        <!-- Movies Grid -->
        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Movie cards will inject here via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-950 text-center py-6 text-sm text-gray-600 border-t border-gray-900">
        <p>&copy; 2026 Shan Movie Zone. Powered by DarkShanYT.</p>
    </footer>

    <!-- JavaScript logic to fetch API -->
    <script>
        // CONFIGURATION
        const API_KEY = "11d0642e3811dd1b"; // Your API Key
        const BASE_URL = "https://api-dark-shan-yt.koyeb.app";

        // Fetch movies on page load (Default search)
        document.addEventListener("DOMContentLoaded", () => {
            fetchMovies("Avatar"); 
        });

        // Trigger search on 'Enter' key
        document.getElementById("searchInput").addEventListener("keypress", (e) => {
            if (e.key === 'Enter') searchMovies();
        });

        function showLoader(show) {
            document.getElementById("loader").classList.toggle("hidden", !show);
        }

        // 1. Search Movies Function
        async function fetchMovies(query) {
            showLoader(true);
            document.getElementById("movieGrid").innerHTML = "";
            try {
                const response = await fetch(`${BASE_URL}/movie/moviepro-search?text=${encodeURIComponent(query)}&apikey=${API_KEY}`);
                const resData = await response.json();

                if (resData.status && resData.data.length > 0) {
                    displayMovies(resData.data);
                } else {
                    document.getElementById("movieGrid").innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No movies found for "${query}".</p>`;
                }
            } catch (error) {
                console.error("Error fetching movies:", error);
                document.getElementById("movieGrid").innerHTML = `<p class="col-span-full text-center text-red-500 py-10">Error connecting to API.</p>`;
            } finally {
                showLoader(false);
            }
        }

        function searchMovies() {
            const query = document.getElementById("searchInput").value.trim();
            if (query) {
                document.getElementById("gridTitle").innerText = `Search Results for: ${query}`;
                fetchMovies(query);
            }
        }

        // 2. Render Movie Cards
        function displayMovies(movies) {
            const grid = document.getElementById("movieGrid");
            grid.innerHTML = movies.map(movie => {
                // Filter out non-adult items if needed or fix broken images
                const rating = movie.rating && movie.rating > 0 ? movie.rating : "N/A";
                return `
                    <div onclick="viewMovieDetails('${movie.id}')" class="movie-card bg-gray-900 rounded-xl overflow-hidden shadow-md cursor-pointer border border-gray-800 hover:border-gray-700 transition duration-300 flex flex-col">
                        <div class="relative overflow-hidden aspect-[2/3]">
                            <img src="${movie.image}" alt="${movie.title}" class="w-full h-full object-cover transition duration-500" loading="lazy">
                            <span class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-yellow-400 px-2 py-0.5 text-xs font-bold rounded flex items-center gap-1">
                                <i class="fa-solid fa-star"></i> ${rating}
                            </span>
                        </div>
                        <div class="p-3 flex-grow flex flex-col justify-between">
                            <h3 class="font-bold text-sm line-clamp-2 text-gray-100 hover:text-red-400 transition">${movie.title}</h3>
                            <p class="text-xs text-gray-500 mt-1">${movie.date ? movie.date.split('-')[0] : 'N/A'} • ${movie.country}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 3. Fetch Movie Info & Downloads
        async function viewMovieDetails(movieId) {
            showLoader(true);
            const detailsSection = document.getElementById("movieDetails");
            detailsSection.classList.add("hidden");
            
            // Scroll to top to see details
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const response = await fetch(`${BASE_URL}/movie/moviepro-info?id=${movieId}&apikey=${API_KEY}`);
                const resData = await response.json();

                if (resData.status) {
                    const movie = resData.data;
                    
                    // Generate Download Buttons HTML
                    const downloadButtons = movie.download.map(dl => `
                        <a href="${dl.link}" target="_blank" class="flex justify-between items-center bg-gray-800 hover:bg-red-600 border border-gray-700 hover:border-red-500 px-4 py-3 rounded-xl font-medium transition text-sm">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-arrow-down"></i> Download ${dl.quality}</span>
                            <span class="text-xs bg-black/40 px-2 py-1 rounded text-gray-300">${dl.size}</span>
                        </a>
                    `).join('');

                    // Generate Cast HTML
                    const castHTML = movie.cast ? movie.cast.slice(0, 5).map(actor => `
                        <div class="text-center w-16 sm:w-20">
                            <img src="${actor.url}" alt="${actor.name}" class="w-12 h-12 sm:w-16 sm:h-16 rounded-full object-cover mx-auto border border-gray-700 shadow">
                            <p class="text-[10px] sm:text-xs font-semibold truncate mt-1 text-gray-200">${actor.name}</p>
                            <p class="text-[9px] text-gray-500 truncate">${actor.character}</p>
                        </div>
                    `).join('') : '';

                    // Inject Details
                    detailsSection.innerHTML = `
                        <div class="flex flex-col md:flex-row gap-8">
                            <!-- Poster -->
                            <div class="w-full md:w-64 shrink-0 flex justify-center">
                                <img src="${movie.image}" alt="${movie.title}" class="w-48 md:w-full rounded-xl shadow-2xl border border-gray-800 object-cover">
                            </div>
                            <!-- Meta Content -->
                            <div class="flex-grow">
                                <div class="flex justify-between items-start gap-4">
                                    <h2 class="text-2xl sm:text-3xl font-black text-white">${movie.title}</h2>
                                    <button onclick="document.getElementById('movieDetails').classList.add('hidden')" class="text-gray-400 hover:text-white text-xl cursor-pointer">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <p class="text-sm text-red-500 font-semibold mt-1">${movie.genre.join(' / ')} • ${movie.year}</p>
                                
                                <div class="flex items-center gap-4 my-3 text-sm text-gray-400">
                                    <span class="flex items-center gap-1 text-yellow-400 font-bold"><i class="fa-solid fa-star"></i> ${movie.rating}</span>
                                    <span>•</span>
                                    <span>${movie.duration}</span>
                                    <span>•</span>
                                    <span>${movie.country}</span>
                                </div>

                                <p class="text-gray-300 text-sm leading-relaxed mt-4 bg-gray-950/50 p-4 rounded-xl border border-gray-800/50">${movie.description || 'No description available.'}</p>
                                
                                <!-- Cast Section -->
                                ${castHTML ? `
                                    <div class="mt-6">
                                        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Top Cast</h4>
                                        <div class="flex flex-wrap gap-4">${castHTML}</div>
                                    </div>
                                ` : ''}

                                <!-- Download Links Section -->
                                <div class="mt-8">
                                    <h4 class="text-sm font-bold uppercase tracking-wider text-red-400 mb-3 flex items-center gap-2">
                                        <i class="fa-solid fa-cloud-arrow-down"></i> Download Options
                                    </h4>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                        ${downloadButtons}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    detailsSection.classList.remove("hidden");
                }
            } catch (error) {
                console.error("Error fetching movie details:", error);
                alert("Could not load download details.");
            } finally {
                showLoader(false);
            }
        }
    </script>
</body>
</html>
