<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test Login System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library for 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #0d1117;
        }
        .glass-card {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }
        .login-content {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="text-gray-200">

    <!-- 3D Animation Background Container -->
    <div id="canvas-container"></div>

    <!-- Loading View -->
    <div id="loading-view" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0d1117]">
        <div class="w-12 h-12 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    </div>

    <!-- Login View -->
    <div id="login-view" class="hidden relative h-screen flex items-center justify-center px-4 login-content">
        <div class="max-w-md w-full p-12 glass-card rounded-[2rem] text-center transform transition-all duration-700">
            <div class="mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-indigo-500/10 mb-8 border border-indigo-500/20">
                    <i class="fas fa-rocket text-4xl text-indigo-400"></i>
                </div>
                <h1 class="text-4xl font-bold mb-3 tracking-tight text-white">TEST LOGIN SYSTEM</h1>
                <p class="text-slate-400 text-sm leading-relaxed px-4">TEST account access login .</p>
            </div>
            
            <div class="space-y-4 px-2">
                <!-- Google Login Button -->
                <button id="google-login-btn" class="w-full group flex items-center justify-center gap-4 px-6 py-4 bg-white text-slate-900 font-bold rounded-2xl hover:bg-slate-100 transition-all duration-300 transform hover:-translate-y-1 active:scale-95 shadow-lg">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-6 h-6">
                    Google Login
                </button>

                <!-- GitHub Login Button -->
                <button id="github-login-btn" class="w-full group flex items-center justify-center gap-4 px-6 py-4 bg-[#24292f] text-white font-bold rounded-2xl hover:bg-[#1a1f24] transition-all duration-300 transform hover:-translate-y-1 active:scale-95 shadow-lg border border-white/5">
                    <i class="fab fa-github text-2xl"></i>
                    GitHub Login
                </button>
            </div>
            
            <p id="error-msg" class="text-red-400 mt-6 text-xs hidden bg-red-500/10 p-3 rounded-xl border border-red-500/20"></p>
            
            <div class="mt-14 pt-8 border-t border-white/5 text-[10px] text-slate-500 uppercase tracking-[0.2em] font-medium">
                CHAMINDU AUTHENTICATION
            </div>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="hidden relative h-screen overflow-hidden flex flex-col login-content">
        <div class="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1">
            <div class="glass-card rounded-[2rem] p-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="text-center md:text-left">
                    <h3 class="text-3xl font-bold text-white mb-1">Dashboard</h3>
                    <p class="text-slate-400">test login system, <span id="user-display-name" class="text-indigo-400 font-bold"></span>!</p>
                </div>
                <div class="flex items-center gap-4 bg-black/30 p-2 pr-8 rounded-full border border-white/5">
                    <img id="user-photo" src="" alt="Profile" class="w-12 h-12 rounded-full border-2 border-indigo-500/30">
                    <div>
                        <p id="user-name" class="text-sm font-bold text-white leading-none mb-1">Peru</p>
                        <p id="user-email" class="text-xs text-slate-500 leading-none">Email</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="glass-card p-8 rounded-[2rem] group hover:border-indigo-500/50 transition-all">
                    <div class="w-12 h-12 rounded-xl bg-green-500/10 flex items-center justify-center mb-6 border border-green-500/20">
                        <i class="fas fa-users text-green-400"></i>
                    </div>
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1">Total Users</p>
                    <h4 class="text-3xl font-bold text-white">1,284</h4>
                </div>
                <div class="glass-card p-8 rounded-[2rem] group hover:border-indigo-500/50 transition-all">
                    <div class="w-12 h-12 rounded-xl bg-indigo-500/10 flex items-center justify-center mb-6 border border-indigo-500/20">
                        <i class="fas fa-bolt text-indigo-400"></i>
                    </div>
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1">Session Info</p>
                    <h4 class="text-3xl font-bold text-white" id="login-method">Google</h4>
                </div>
                <div class="glass-card p-8 rounded-[2rem] group hover:border-indigo-500/50 transition-all">
                    <div class="w-12 h-12 rounded-xl bg-purple-500/10 flex items-center justify-center mb-6 border border-purple-500/20">
                        <i class="fas fa-clock text-purple-400"></i>
                    </div>
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1">Active Status</p>
                    <h4 class="text-3xl font-bold text-white">Online</h4>
                </div>
            </div>

            <button id="logout-btn" class="px-8 py-4 bg-red-500/10 text-red-400 rounded-2xl hover:bg-red-500 hover:text-white transition-all font-bold flex items-center gap-3">
                <i class="fas fa-power-off"></i> Logout
            </button>
        </div>
    </div>

    <script type="module">
        let scene, camera, renderer, stars, starGeo;
        
        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 1;
            camera.rotation.x = Math.PI/2;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            starGeo = new THREE.BufferGeometry();
            let positions = [];
            for(let i=0; i<8000; i++) {
                let star = new THREE.Vector3(Math.random() * 600 - 300, Math.random() * 600 - 300, Math.random() * 600 - 300);
                positions.push(star.x, star.y, star.z);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            let sprite = new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/sprites/circle.png');
            let starMaterial = new THREE.PointsMaterial({ color: 0x4f46e5, size: 0.5, map: sprite, transparent: true, opacity: 0.8 });
            stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            document.addEventListener('mousemove', (e) => {
                stars.rotation.y = (e.clientX / window.innerWidth - 0.5) * 0.2;
                stars.rotation.x = (e.clientY / window.innerHeight - 0.5) * 0.2;
            });

            function animate() {
                const pos = starGeo.attributes.position.array;
                for(let i=1; i<pos.length; i+=3) {
                    pos[i] -= 0.05;
                    if (pos[i] < -200) pos[i] = 200;
                }
                starGeo.attributes.position.needsUpdate = true;
                stars.rotation.y += 0.0005;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.onload = init3D;

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, GithubAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";  

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBI-A1vwTeYaD-z6CeYAQ2IdQ3m_GXyA8M",
  authDomain: "wallpaper-8f90c.firebaseapp.com",
  projectId: "wallpaper-8f90c",
  storageBucket: "wallpaper-8f90c.firebasestorage.app",
  messagingSenderId: "1066530041230",
  appId: "1:1066530041230:web:51f35f2471c31e348808df",
  measurementId: "G-0PEF2WCBJE"
};

        let finalConfig = firebaseConfig;
        if (typeof __firebase_config !== 'undefined') finalConfig = JSON.parse(__firebase_config);

        const app = initializeApp(finalConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        const githubProvider = new GithubAuthProvider();

        const loadingView = document.getElementById('loading-view');
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const errorMsg = document.getElementById('error-msg');
        
        onAuthStateChanged(auth, (user) => {
            loadingView.classList.add('hidden');
            if (user) {
                const name = user.displayName || user.email.split('@')[0];
                document.getElementById('user-name').textContent = name;
                document.getElementById('user-display-name').textContent = name.split(' ')[0];
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-photo').src = user.photoURL || 'https://ui-avatars.com/api/?background=4f46e5&color=fff&name=' + name;
                
                // Show provider
                const providerId = user.providerData[0]?.providerId;
                document.getElementById('login-method').textContent = providerId === 'google.com' ? 'Google' : 'GitHub';

                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        });

        async function handleLogin(provider) {
            errorMsg.classList.add('hidden');
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                errorMsg.textContent = error.code === 'auth/account-exists-with-different-credential' 
                    ? "Ee email tho vere login method munde undi." 
                    : error.message;
                errorMsg.classList.remove('hidden');
            }
        }

        document.getElementById('google-login-btn').addEventListener('click', () => handleLogin(googleProvider));
        document.getElementById('github-login-btn').addEventListener('click', () => handleLogin(githubProvider));
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
