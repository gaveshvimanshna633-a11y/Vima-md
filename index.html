<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CineStream</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-thumb{background:#1a2030;border-radius:3px}
  body{background:#07090f;min-height:100vh;font-family:'Inter',system-ui,sans-serif;color:#eef0f8;overflow-x:hidden}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

  /* HEADER */
  header{position:sticky;top:0;z-index:100;background:rgba(7,9,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid #1a2030;padding:0 32px;height:62px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;background:linear-gradient(135deg,#f0c040,#e85530);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  nav{display:flex;gap:28px}
  .nav-item{color:#3a4560;font-size:14px;font-weight:600;cursor:pointer;transition:color .2s}
  .nav-item:hover,.nav-item.active{color:#eef0f8}

  /* HERO */
  .hero{padding:56px 24px 28px;max-width:700px;margin:0 auto;text-align:center}
  .hero-h{font-family:'Bebas Neue',sans-serif;font-size:64px;font-weight:400;line-height:1.0;margin-bottom:10px;letter-spacing:2px}
  .hero-accent{background:linear-gradient(135deg,#f0c040,#e85530);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .hero-sub{color:#4a5570;font-size:15px;margin-bottom:28px}
  .search-box{display:flex;background:#0d1120;border:1.5px solid #1d2438;border-radius:14px;overflow:hidden;transition:border-color .2s}
  .search-box:focus-within{border-color:#f0c04055}
  .search-input{flex:1;background:none;border:none;outline:none;color:#eef0f8;font-size:16px;padding:15px 20px;font-family:inherit}
  .search-input::placeholder{color:#2d3550}
  .search-btn{background:linear-gradient(135deg,#f0c040,#e85530);border:none;color:#07090f;font-weight:800;font-size:14px;padding:0 28px;cursor:pointer;letter-spacing:0.5px;flex-shrink:0;transition:opacity .2s}
  .search-btn:hover{opacity:0.88}

  /* SECTION */
  .section{padding:10px 28px 52px;max-width:1380px;margin:0 auto}
  .s-label{font-size:11px;font-weight:800;letter-spacing:3px;color:#2d3550;margin-bottom:20px;display:flex;align-items:center;gap:12px}
  .s-line{flex:1;height:1px;background:#141c2e}
  .ai-note{display:inline-flex;align-items:center;gap:6px;background:rgba(240,192,64,0.08);border:1px solid rgba(240,192,64,0.15);color:#f0c040;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}
  .card{background:#0d1120;border-radius:14px;overflow:hidden;border:1px solid #1a2030;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .22s;position:relative}
  .card:hover{transform:translateY(-7px);box-shadow:0 22px 44px rgba(0,0,0,.55);border-color:#f0c040}
  .card:hover .card-img{transform:scale(1.06)}
  .img-wrap{position:relative;aspect-ratio:2/3;overflow:hidden;background:#141c2e}
  .card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .badge{position:absolute;top:8px;left:8px;background:rgba(7,9,15,0.88);border:1px solid #1a2030;color:#f0c040;font-size:9px;font-weight:800;padding:2px 7px;border-radius:4px;letter-spacing:1px}
  .r-badge{position:absolute;top:8px;right:8px;background:rgba(7,9,15,0.88);color:#f0c040;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px}
  .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#2d3550;font-size:40px}
  .card-body{padding:11px 12px 14px}
  .card-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
  .card-meta{display:flex;gap:5px;flex-wrap:wrap}
  .tag{background:#111827;color:#3a4560;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}

  /* LOADER */
  .load-wrap{text-align:center;padding:70px 20px;color:#3a4560}
  .spin{width:38px;height:38px;border:3px solid #1a2030;border-top-color:#f0c040;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
  .load-txt{font-size:14px}

  /* MODAL */
  .backdrop{position:fixed;inset:0;background:rgba(7,9,15,0.95);backdrop-filter:blur(12px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-box{background:#0d1120;border:1px solid #1a2030;border-radius:20px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
  .modal-hero{position:relative;aspect-ratio:16/6;overflow:hidden;background:#111827}
  .modal-hero-img{width:100%;height:100%;object-fit:cover;display:block}
  .modal-grad{position:absolute;inset:0;background:linear-gradient(to top,#0d1120 0%,transparent 55%)}
  .modal-close{position:absolute;top:14px;right:14px;background:rgba(7,9,15,0.8);border:1px solid #1a2030;color:#eef0f8;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
  .modal-close:hover{background:rgba(240,192,64,0.2)}
  .modal-body{padding:26px 30px 34px}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:40px;font-weight:400;letter-spacing:1px;margin-bottom:12px}
  .modal-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .m-tag{background:#111827;color:#4a5570;font-size:12px;padding:4px 12px;border-radius:20px}
  .m-tag-gold{background:rgba(240,192,64,0.1);color:#f0c040;border:1px solid rgba(240,192,64,0.2);font-size:12px;padding:4px 12px;border-radius:20px}
  .modal-syn{color:#4a5570;font-size:14px;line-height:1.8;margin-bottom:26px}
  .modal-actions{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}
  .btn-primary{padding:13px 26px;border-radius:10px;border:none;background:linear-gradient(135deg,#f0c040,#e85530);color:#07090f;font-weight:800;font-size:14px;cursor:pointer;transition:opacity .2s;font-family:inherit}
  .btn-primary:hover{opacity:0.88}
  .btn-sec{padding:13px 26px;border-radius:10px;background:#111827;color:#eef0f8;border:1px solid #1a2030;font-weight:700;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s;font-family:inherit}
  .btn-sec:hover{background:#1a2030;border-color:#f0c040}
  .btn-sec.downloading{animation:pulse 1s infinite;pointer-events:none}

  /* CAST */
  .cast-head{font-size:10px;font-weight:800;letter-spacing:3px;color:#2d3550;margin-bottom:14px}
  .cast-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
  .cast-card{flex-shrink:0;width:70px;text-align:center}
  .cast-img-wrap{width:56px;height:56px;border-radius:50%;border:2px solid #1a2030;margin:0 auto 6px;background:#111827;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
  .cast-img-wrap img{width:100%;height:100%;object-fit:cover}
  .cast-name{font-size:10px;color:#3a4560;line-height:1.3}
  .director-line{margin-top:16px;color:#3a4560;font-size:13px}
  .director-name{color:#f0c040;font-weight:700}

  /* DOWNLOAD TOAST */
  .toast{position:fixed;bottom:28px;right:28px;background:#0d1120;border:1px solid #f0c04055;border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#f0c040;z-index:9999;transform:translateY(80px);opacity:0;transition:transform .35s ease,opacity .35s ease;pointer-events:none}
  .toast.show{transform:translateY(0);opacity:1}
  .toast-icon{font-size:18px}

  /* RESPONSIVE */
  @media(max-width:600px){
    .hero-h{font-size:44px}
    header{padding:0 16px}
    .section{padding:10px 14px 40px}
    .modal-body{padding:16px 16px 24px}
    .modal-title{font-size:28px}
  }
</style>
</head>
<body>

<header>
  <div class="logo">CineStream</div>
  <nav>
    <span class="nav-item active">Home</span>
    <span class="nav-item">Movies</span>
    <span class="nav-item">Series</span>
  </nav>
</header>

<div class="hero">
  <div class="hero-h">Find Your Next<br><span class="hero-accent">Watch</span></div>
  <p class="hero-sub">AI-powered movie search — stream &amp; download instantly</p>
  <div class="search-box">
    <input class="search-input" id="searchInput" placeholder="Search any movie or TV show..." />
    <button class="search-btn" onclick="doSearch()">🔍 SEARCH</button>
  </div>
</div>

<div class="section">
  <div class="s-label" id="sectionLabel">
    FEATURED MOVIES
    <div class="s-line"></div>
    <span class="ai-note" id="aiNote" style="display:none">✨ AI Search</span>
  </div>
  <div id="loadWrap" style="display:none" class="load-wrap">
    <div class="spin"></div>
    <p class="load-txt">AI is searching movies...</p>
    <p class="load-txt" style="font-size:12px;margin-top:6px;opacity:0.6">This may take 10–15 seconds</p>
  </div>
  <div id="emptyWrap" style="display:none" class="load-wrap">
    <p style="font-size:48px">🎬</p>
    <p style="margin-top:12px;font-size:15px">No results found. Try another search.</p>
    <button class="btn-primary" style="margin-top:20px;font-size:13px" onclick="resetFeatured()">Back to Featured</button>
  </div>
  <div class="grid" id="movieGrid"></div>
</div>

<!-- MODAL -->
<div class="backdrop" id="backdrop" style="display:none" onclick="closeModalOnBackdrop(event)">
  <div class="modal-box" id="modalBox">
    <div id="modalContent"></div>
  </div>
</div>

<!-- DOWNLOAD TOAST -->
<div class="toast" id="toast">
  <span class="toast-icon">⬇️</span>
  <span id="toastMsg">Preparing download...</span>
</div>

<script>
const FEATURED = [
  {id:"f1",title:"Avengers: Endgame",year:2019,rating:8.4,genres:["Action","Sci-Fi"],type:"movie",synopsis:"The Avengers assemble once more to reverse Thanos's actions and restore balance to the universe.",image:"https://image.tmdb.org/t/p/w342/or06FN3Dka5tukK1e9sl16pB3iy.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg",runtime:181,mpaRating:"PG-13",cast:["Robert Downey Jr.","Chris Evans","Scarlett Johansson"],director:"Anthony & Joe Russo"},
  {id:"f2",title:"Inception",year:2010,rating:8.8,genres:["Sci-Fi","Thriller"],type:"movie",synopsis:"A thief who steals corporate secrets through dream-sharing technology is given the inverse task of planting an idea.",image:"https://image.tmdb.org/t/p/w342/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/s3TBrRGB1iav7gFOCNx3H31MoES.jpg",runtime:148,mpaRating:"PG-13",cast:["Leonardo DiCaprio","Joseph Gordon-Levitt","Elliot Page"],director:"Christopher Nolan"},
  {id:"f3",title:"The Dark Knight",year:2008,rating:9.0,genres:["Action","Crime"],type:"movie",synopsis:"Batman raises the stakes in his war on crime as the Joker wreaks havoc and chaos on Gotham City.",image:"https://image.tmdb.org/t/p/w342/qJ2tW6WMUDux911r6m7haRef0WH.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/hkBaDkMWbLaf8B1lsWsKX7Ew3Xq.jpg",runtime:152,mpaRating:"PG-13",cast:["Christian Bale","Heath Ledger","Aaron Eckhart"],director:"Christopher Nolan"},
  {id:"f4",title:"Interstellar",year:2014,rating:8.6,genres:["Sci-Fi","Drama"],type:"movie",synopsis:"A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.",image:"https://image.tmdb.org/t/p/w342/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/rAiYTfKGqDCRIIqo664sY9XZIvQ.jpg",runtime:169,mpaRating:"PG-13",cast:["Matthew McConaughey","Anne Hathaway","Jessica Chastain"],director:"Christopher Nolan"},
  {id:"f5",title:"Parasite",year:2019,rating:8.5,genres:["Drama","Thriller"],type:"movie",synopsis:"Greed and class discrimination threaten the symbiotic relationship between the wealthy Park family and the destitute Kim clan.",image:"https://image.tmdb.org/t/p/w342/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/ApiBzeaa95TNYLSKkEWznSKCrax.jpg",runtime:132,mpaRating:"R",cast:["Song Kang-ho","Lee Sun-kyun","Cho Yeo-jeong"],director:"Bong Joon-ho"},
  {id:"f6",title:"Dune: Part Two",year:2024,rating:8.5,genres:["Sci-Fi","Adventure"],type:"movie",synopsis:"Paul Atreides unites with Chani and the Fremen while on a warpath of revenge against the conspirators who destroyed his family.",image:"https://image.tmdb.org/t/p/w342/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/xOMo8BRK7PfcJv9JCnx7s5hj0PX.jpg",runtime:166,mpaRating:"PG-13",cast:["Timothée Chalamet","Zendaya","Rebecca Ferguson"],director:"Denis Villeneuve"},
  {id:"f7",title:"Oppenheimer",year:2023,rating:8.3,genres:["Drama","History"],type:"movie",synopsis:"The story of American scientist J. Robert Oppenheimer and his role in the development of the atomic bomb.",image:"https://image.tmdb.org/t/p/w342/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/fm6KqXpk3M2HVveHwCrBSSBaO0V.jpg",runtime:180,mpaRating:"R",cast:["Cillian Murphy","Emily Blunt","Robert Downey Jr."],director:"Christopher Nolan"},
  {id:"f8",title:"Spider-Man: No Way Home",year:2021,rating:8.2,genres:["Action","Sci-Fi"],type:"movie",synopsis:"Peter Parker's identity is revealed and he asks Doctor Strange for help, but things become more dangerous.",image:"https://image.tmdb.org/t/p/w342/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/iQFcwSGbZXMkeyKrxbPnwnRo5fl.jpg",runtime:148,mpaRating:"PG-13",cast:["Tom Holland","Zendaya","Benedict Cumberbatch"],director:"Jon Watts"},
  {id:"f9",title:"Everything Everywhere All at Once",year:2022,rating:8.1,genres:["Sci-Fi","Comedy"],type:"movie",synopsis:"A middle-aged Chinese-American immigrant is thrust into a multiverse adventure, discovering she must connect with parallel versions of herself.",image:"https://image.tmdb.org/t/p/w342/w3LxiVYdWWRvEVdn5RYq6jIqkb1.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/feSiISwgEpVzR1v3zv2n2AU4ANJ.jpg",runtime:139,mpaRating:"R",cast:["Michelle Yeoh","Stephanie Hsu","Ke Huy Quan"],director:"Daniel Kwan & Daniel Scheinert"},
  {id:"f10",title:"Joker",year:2019,rating:8.4,genres:["Drama","Crime"],type:"movie",synopsis:"In Gotham City, mentally troubled comedian Arthur Fleck is disregarded by society, causing him to slowly descend into insanity.",image:"https://image.tmdb.org/t/p/w342/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg",backdrop:"https://image.tmdb.org/t/p/w1280/n6bUvigpRFqSwmPp1m2YAjwLRba.jpg",runtime:122,mpaRating:"R",cast:["Joaquin Phoenix","Robert De Niro","Zazie Beetz"],director:"Todd Phillips"},
];

let currentMovies = [...FEATURED];
let isSearchMode = false;
let currentModal = null;

// ── Render ──────────────────────────────────────────────────────────────────
function renderGrid(movies) {
  const grid = document.getElementById('movieGrid');
  grid.innerHTML = '';
  movies.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animation = `fadeUp .35s ease ${i * 0.05}s both`;
    card.innerHTML = `
      <div class="img-wrap">
        ${m.image
          ? `<img class="card-img" src="${m.image}" alt="${escHtml(m.title)}" onerror="this.parentNode.innerHTML='<div class=no-img>🎬</div>'">`
          : `<div class="no-img">🎬</div>`}
        <div class="badge">${escHtml((m.type||'movie').toUpperCase())}</div>
        ${m.rating ? `<div class="r-badge">⭐ ${typeof m.rating==='number'?m.rating.toFixed(1):m.rating}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(m.title)}</div>
        <div class="card-meta">
          ${m.year ? `<span class="tag">${m.year}</span>` : ''}
          ${m.genres?.[0] ? `<span class="tag">${escHtml(m.genres[0])}</span>` : ''}
        </div>
      </div>`;
    card.onclick = () => openDetail(m);
    grid.appendChild(card);
  });
}

function setLoading(on) {
  document.getElementById('loadWrap').style.display = on ? 'block' : 'none';
  document.getElementById('movieGrid').style.display = on ? 'none' : '';
  document.getElementById('emptyWrap').style.display = 'none';
}

function setLabel(txt, showAi) {
  document.getElementById('sectionLabel').childNodes[0].textContent = txt + ' ';
  document.getElementById('aiNote').style.display = showAi ? 'inline-flex' : 'none';
}

function resetFeatured() {
  currentMovies = [...FEATURED];
  isSearchMode = false;
  document.getElementById('searchInput').value = '';
  setLabel('FEATURED MOVIES', false);
  setLoading(false);
  document.getElementById('emptyWrap').style.display = 'none';
  renderGrid(currentMovies);
}

// ── Search ───────────────────────────────────────────────────────────────────
async function searchMoviesViaAI(query) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:4000,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      system:`You are a movie database assistant. Search the web for movies matching the query and return ONLY a valid JSON array (no markdown, no explanation) with up to 10 results using this structure:
[{"id":"tmdb-{id}","title":"Title","year":2023,"rating":7.5,"genres":["Action"],"synopsis":"Short synopsis.","image":"https://image.tmdb.org/t/p/w342/{poster_path}","backdrop":"https://image.tmdb.org/t/p/w1280/{backdrop_path}","runtime":120,"type":"movie","cast":["Actor 1","Actor 2"],"director":"Director","mpaRating":"PG-13"}]
Return ONLY the JSON array.`,
      messages:[{role:"user",content:`Search for movies: "${query}". Return top results as JSON array.`}]
    })
  });
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')||'[]';
  const clean = text.replace(/```json|```/g,'').trim();
  const match = clean.match(/\[[\s\S]*\]/);
  if(!match) return [];
  return JSON.parse(match[0]);
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  setLoading(true);
  isSearchMode = true;
  setLabel(`SEARCHING "${q.toUpperCase()}"...`, false);
  try {
    const results = await searchMoviesViaAI(q);
    setLoading(false);
    if(results.length > 0) {
      currentMovies = results;
      setLabel(`RESULTS FOR "${q.toUpperCase()}"`, true);
      renderGrid(results);
    } else {
      document.getElementById('movieGrid').style.display = 'none';
      document.getElementById('emptyWrap').style.display = 'block';
      setLabel('NO RESULTS FOUND', false);
    }
  } catch(e) {
    setLoading(false);
    resetFeatured();
  }
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') doSearch();
});

// ── Detail / Modal ───────────────────────────────────────────────────────────
async function getMovieDetailViaAI(title, year) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:2000,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      system:`You are a movie database assistant. Search for detailed info and return ONLY valid JSON (no markdown):
{"title":"...","titleLong":"Title (Year)","year":2023,"rating":7.5,"voteCount":10000,"genres":["Action"],"synopsis":"Full synopsis.","runtime":120,"mpaRating":"PG-13","director":"Name","cast":[{"name":"Actor","character":"Role"}],"image":"tmdb url","backdrop":"tmdb url"}
Return ONLY the JSON object.`,
      messages:[{role:"user",content:`Get detailed info for: "${title}" (${year})`}]
    })
  });
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')||'{}';
  const clean = text.replace(/```json|```/g,'').trim();
  const match = clean.match(/\{[\s\S]*\}/);
  if(!match) return {};
  return JSON.parse(match[0]);
}

async function openDetail(movie) {
  currentModal = {...movie};
  document.getElementById('backdrop').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  renderModal(movie, true);
  try {
    const detail = await getMovieDetailViaAI(movie.title, movie.year);
    currentModal = {...movie, ...detail};
    renderModal(currentModal, false);
  } catch {
    renderModal(movie, false);
  }
}

function renderModal(m, loading) {
  const content = document.getElementById('modalContent');
  if(loading) {
    content.innerHTML = `<div class="load-wrap" style="padding:80px 40px"><div class="spin"></div><p class="load-txt">Loading details...</p></div>`;
    return;
  }
  const castHtml = (m.cast||[]).length > 0 ? `
    <div class="cast-head">CAST</div>
    <div class="cast-row">
      ${(m.cast||[]).slice(0,12).map(c => {
        const name = typeof c==='string'?c:c.name;
        const char = typeof c==='object'?c.character:'';
        const img  = typeof c==='object'?c.image:null;
        return `<div class="cast-card">
          <div class="cast-img-wrap">${img?`<img src="${escAttr(img)}" alt="${escAttr(name)}" onerror="this.style.display='none'">`:`👤`}</div>
          <div class="cast-name">${escHtml(name)}</div>
          ${char?`<div class="cast-name" style="font-size:9px;opacity:.6">${escHtml(char)}</div>`:''}
        </div>`;
      }).join('')}
    </div>` : '';

  const ratingStr = m.rating ? (typeof m.rating==='number'?m.rating.toFixed(1):m.rating) : '';
  const voteStr = m.voteCount ? ` (${Number(m.voteCount).toLocaleString()})` : '';

  content.innerHTML = `
    <div class="modal-hero">
      ${(m.backdrop||m.image)?`<img class="modal-hero-img" src="${escAttr(m.backdrop||m.image)}" alt="${escAttr(m.title)}" onerror="this.style.display='none'">`:
      `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:72px">🎬</div>`}
      <div class="modal-grad"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-title">${escHtml(m.titleLong || `${m.title} (${m.year})`)}</div>
      <div class="modal-tags">
        ${m.year?`<span class="m-tag-gold">${m.year}</span>`:''}
        ${m.runtime?`<span class="m-tag">${m.runtime} min</span>`:''}
        ${m.mpaRating?`<span class="m-tag">${escHtml(m.mpaRating)}</span>`:''}
        ${ratingStr?`<span class="m-tag">⭐ ${ratingStr}${voteStr}</span>`:''}
        ${(m.genres||[]).map(g=>`<span class="m-tag">${escHtml(g)}</span>`).join('')}
      </div>
      <p class="modal-syn">${escHtml(m.synopsis||'No synopsis available.')}</p>
      <div class="modal-actions">
        <button class="btn-primary">▶ Watch Now</button>
        <button class="btn-sec" id="dlBtn" onclick="handleDownload(this, '${escAttr(m.title)}', ${m.year||''})">⬇ Download</button>
      </div>
      ${castHtml}
      ${m.director?`<p class="director-line"><span class="director-name">Director:</span> ${escHtml(m.director)}</p>`:''}
    </div>`;
}

function closeModal() {
  document.getElementById('backdrop').style.display = 'none';
  document.body.style.overflow = '';
  currentModal = null;
}

function closeModalOnBackdrop(e) {
  if(e.target === e.currentTarget) closeModal();
}

// ── Download Button ──────────────────────────────────────────────────────────
function handleDownload(btn, title, year) {
  btn.classList.add('downloading');
  btn.textContent = '⏳ Preparing...';

  // Generate a simple .txt info file as a demo download
  const info = [
    `CineStream — Movie Info`,
    `========================`,
    `Title  : ${title}`,
    `Year   : ${year||'N/A'}`,
    ...(currentModal ? [
      `Rating : ${currentModal.rating||'N/A'}`,
      `Runtime: ${currentModal.runtime ? currentModal.runtime+' min' : 'N/A'}`,
      `Rated  : ${currentModal.mpaRating||'N/A'}`,
      `Genres : ${(currentModal.genres||[]).join(', ')||'N/A'}`,
      `Director: ${currentModal.director||'N/A'}`,
      ``,
      `Synopsis:`,
      currentModal.synopsis||'No synopsis available.',
    ] : []),
    ``,
    `Downloaded via CineStream`,
  ].join('\n');

  const blob = new Blob([info], {type:'text/plain'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `${title.replace(/[^a-z0-9]/gi,'_')}_${year||'info'}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast(`"${title}" info downloaded!`);

  setTimeout(() => {
    btn.classList.remove('downloading');
    btn.textContent = '⬇ Download';
  }, 2000);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s||'').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderGrid(FEATURED);
</script>
