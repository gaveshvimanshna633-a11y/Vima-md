                </button>
            </div>
        </div>
    </header>

                    { quality: "720p", size: "850 MB", link: "#" }
                ]
            }
        ];

        document.addEventListener("DOMContentLoaded", () => displayMovies(MOVIE_DATABASE));

        // Display Movies in Grid
        function displayMovies(movies) {
            const grid = document.getElementById("movieGrid");
            if (movies.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No movies found.</p>`;
                return;
            }
            grid.innerHTML = movies.map(movie => `
                <div onclick="viewMovieDetails('${movie.id}')" class="movie-card bg-gray-900 rounded-xl overflow-hidden shadow-md cursor-pointer border border-gray-800 hover:border-gray-700 transition duration-300 flex flex-col">
                    <div class="relative overflow-hidden aspect-[2/3]">
                        <img src="${movie.image}" alt="${movie.title}" class="w-full h-full object-cover transition duration-500" loading="lazy">
                        <span class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-yellow-400 px-2 py-0.5 text-xs font-bold rounded flex items-center gap-1">
                            <i class="fa-solid fa-star"></i> ${movie.rating}
                        </span>
                    </div>
                    <div class="p-3 flex-grow flex flex-col justify-between">
                        <h3 class="font-bold text-sm line-clamp-2 text-gray-100 hover:text-red-400 transition">${movie.title}</h3>
                        <p class="text-xs text-gray-500 mt-1">${movie.year} • ${movie.country}</p>
                    </div>
                </div>
            `).join('');
        }

        // Live Search
        function searchMovies() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const filtered = MOVIE_DATABASE.filter(m => m.title.toLowerCase().includes(query));
            document.getElementById("gridTitle").innerText = query ? `Search Results for: ${query}` : "Trending Movies";
            displayMovies(filtered);
        }

        // View Detail Section
        function viewMovieDetails(movieId) {
            const movie = MOVIE_DATABASE.find(m => m.id === movieId);
            if (!movie) return;

            const detailsSection = document.getElementById("movieDetails");
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Render Cast
            const castHTML = movie.cast && movie.cast.length > 0 ? movie.cast.map(actor => `
                <div class="text-center w-20 shrink-0">
                    <img src="${actor.url || 'https://img.icons8.com/ios-filled/100/ffffff/user-male-circle.png'}" alt="${actor.name}" class="w-16 h-16 rounded-full object-cover mx-auto border border-gray-700 shadow bg-gray-800">
                    <p class="text-[10px] font-semibold truncate mt-1 text-gray-200">${actor.name}</p>
                    <p class="text-[9px] text-gray-500 truncate">${actor.character}</p>
                </div>
            `).join('') : '';

            // Render Download Buttons
            const downloadButtons = movie.download.map(dl => `
                <a href="${dl.link}" target="_blank" class="flex justify-between items-center bg-gray-800 hover:bg-red-600 border border-gray-700 hover:border-red-500 px-4 py-3 rounded-xl font-medium transition text-sm">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-arrow-down"></i> Download ${dl.quality}</span>
                    <span class="text-xs bg-black/40 px-2 py-1 rounded text-gray-300">${dl.size}</span>
                </a>
            `).join('');

            detailsSection.innerHTML = `
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="w-full md:w-64 shrink-0 flex justify-center">
                        <img src="${movie.image}" alt="${movie.title}" class="w-48 md:w-full rounded-xl shadow-2xl border border-gray-800 object-cover">
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-start gap-4">
                            <h2 class="text-2xl sm:text-3xl font-black text-white">${movie.title}</h2>
                            <button onclick="document.getElementById('movieDetails').classList.add('hidden')" class="text-gray-400 hover:text-white text-xl cursor-pointer">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <p class="text-sm text-red-500 font-semibold mt-1">${movie.genre.join(' / ')} • ${movie.year}</p>
                        
                        <div class="flex items-center gap-4 my-3 text-sm text-gray-400">
                            <span class="flex items-center gap-1 text-yellow-400 font-bold"><i class="fa-solid fa-star"></i> ${movie.rating}</span>
                            <span>•</span>
                            <span>${movie.duration}</span>
                            <span>•</span>
                            <span>${movie.country}</span>
                        </div>

                        <p class="text-gray-300 text-sm leading-relaxed mt-4 bg-gray-950/50 p-4 rounded-xl border border-gray-800/50">${movie.description}</p>
                        
                        ${castHTML ? `
                            <div class="mt-6">
                                <h4 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Top Cast</h4>
                                <div class="flex gap-4 overflow-x-auto pb-2 scrollbar-none">${castHTML}</div>
                            </div>
                        ` : ''}

                        <div class="mt-8">
                            <h4 class="text-sm font-bold uppercase tracking-wider text-red-400 mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-cloud-arrow-down"></i> Download Options
                            </h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                ${downloadButtons}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            detailsSection.classList.remove("hidden");
        }
    </script>
</body>
</html>
