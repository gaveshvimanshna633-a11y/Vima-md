<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #050505; min-height: 100vh; color: #fff; overflow-x: hidden; }

        /* Snow & Header Styles (Same as before) */
        .snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; overflow: hidden; }
        .snowflake { position: absolute; top: -10px; color: rgba(255, 255, 255, 0.6); font-size: 1em; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10px); opacity: 1; } 100% { transform: translateY(100vh); opacity: 0.2; } }

        .header { text-align: center; padding: 50px 20px 25px; position: relative; z-index: 10; }
        .logo { font-size: 3rem; font-weight: 700; background: linear-gradient(135deg, #ff4d4d, #cc0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .typing-container { font-size: 1.1rem; color: #ff9999; min-height: 28px; }

        /* Sidebar Styles */
        .menu-btn { position: fixed; top: 20px; left: 20px; width: 48px; height: 48px; background: linear-gradient(135deg, #cc0000, #990000); border: none; border-radius: 12px; color: #fff; cursor: pointer; z-index: 1001; }
        .sidebar { position: fixed; top: 0; left: -350px; width: 350px; height: 100vh; background: #0d0000; z-index: 1002; transition: 0.4s; border-right: 1px solid rgba(204, 0, 0, 0.2); }
        .sidebar.active { left: 0; }
        .sidebar-header { padding: 30px; background: #cc0000; text-align: center; }
        .sidebar-content { padding: 25px; }

        .dev-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(204, 0, 0, 0.2); border-radius: 12px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; }
        .dev-card:hover { background: rgba(204, 0, 0, 0.2); transform: translateX(5px); }

        /* Grid & Modal Styles */
        .wallpaper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; max-width: 800px; margin: 0 auto; }
        .wallpaper-card { border-radius: 20px; overflow: hidden; background: #111; cursor: pointer; position: relative; }
        .wallpaper-card img { width: 100%; display: block; object-fit: cover; }

        .gallery-modal, .info-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .active { display: flex !important; }
        .modal-content { background: #1a0000; padding: 30px; border-radius: 20px; border: 1px solid #cc0000; max-width: 90%; text-align: center; }
        
        .gallery-image { max-width: 90%; max-height: 70vh; border-radius: 15px; margin-bottom: 15px; }
        .download-btn { padding: 12px 25px; background: #cc0000; color: #fff; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
        
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: #fff; cursor: pointer; background: none; border: none; }
    </style>
</head>
<body>

    <div class="snow-container" id="snowContainer"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Menu</h2>
        </div>
        <div class="sidebar-content">
            <h3 style="color: #ff4d4d; margin-bottom: 15px;">Developers</h3>
            <div class="dev-card" onclick="showDevInfo('gavesh')">
                <div class="name">Gavesh Vimanshana</div>
                <div class="role" style="font-size: 0.8rem; color: #cc6666;">Lead Developer</div>
            </div>
            <div class="dev-card" onclick="showDevInfo('kaveesha')">
                <div class="name">P Kaveesha</div>
                <div class="role" style="font-size: 0.8rem; color: #cc6666;">Co-Developer</div>
            </div>
        </div>
    </aside>

    <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <header class="header">
        <h1 class="logo">Wallpaper Story</h1>
        <div class="typing-container" id="typingText"></div>
    </header>

    <main class="wallpaper-grid" id="wallpaperGrid"></main>

    <div class="gallery-modal" id="galleryModal">
        <button class="close-btn" onclick="closeGallery()">&times;</button>
        <img class="gallery-image" id="galleryImage">
        <h3 id="galleryTitle" style="margin-bottom: 10px;"></h3>
        <a id="directDownload" class="download-btn">Download Now</a>
    </div>

    <div class="info-modal" id="infoModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeInfo()">&times;</button>
            <h2 id="infoTitle" style="color: #ff4d4d;"></h2>
            <p id="infoBody" style="margin-top: 15px; line-height: 1.6;"></p>
        </div>
    </div>

    <script>
        const wallpapers = [
            { id: 1, title: "Jellyfish Glow", url: "https://images.unsplash.com/photo-1546026423-cc4642628d2b?q=80&w=1000" },
            { id: 2, title: "Autumn Forest", url: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1000" },
            { id: 3, title: "Cyber City", url: "https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=1000" },
            { id: 4, title: "Neon Night", url: "https://images.unsplash.com/photo-1515630278258-407f66498911?q=80&w=1000" }
        ];

        function renderWallpapers() {
            const grid = document.getElementById('wallpaperGrid');
            wallpapers.forEach(wp => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                card.innerHTML = `<img src="${wp.url}" style="height:250px">`;
                card.onclick = () => openGallery(wp);
                grid.appendChild(card);
            });
        }

        // Direct Download logic
        async function downloadImage(url, filename) {
            const response = await fetch(url);
            const blob = await response.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(blobUrl);
        }

        function openGallery(wp) {
            document.getElementById('galleryImage').src = wp.url;
            document.getElementById('galleryTitle').innerText = wp.title;
            const dlBtn = document.getElementById('directDownload');
            dlBtn.onclick = () => downloadImage(wp.url, wp.title + '.jpg');
            document.getElementById('galleryModal').classList.add('active');
        }

        function closeGallery() { document.getElementById('galleryModal').classList.remove('active'); }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

        function showDevInfo(dev) {
            const modal = document.getElementById('infoModal');
            const title = document.getElementById('infoTitle');
            const body = document.getElementById('infoBody');
            
            if(dev === 'gavesh') {
                title.innerText = "Gavesh Vimanshana";
                body.innerText = "Lead Developer & Designer. Expert in creating high-end web experiences and UI design.";
            } else {
                title.innerText = "P Kaveesha";
                body.innerText = "Co-Developer & UI/UX Specialist. Focused on user experience and front-end optimization.";
            }
            modal.classList.add('active');
        }

        function closeInfo() { document.getElementById('infoModal').classList.remove('active'); }

        // Snow & Typing Init
        function init() {
            renderWallpapers();
            const container = document.getElementById('snowContainer');
            for (let i = 0; i < 30; i++) {
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.innerHTML = '&#10052;';
                snow.style.left = Math.random() * 100 + '%';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                container.appendChild(snow);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
