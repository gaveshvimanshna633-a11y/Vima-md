<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Shan Movies - Free Movie Streaming</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #e50914;
            --secondary: #b20710;
            --dark: #0f0f0f;
            --darker: #000000;
            --card: #1a1a1a;
            --card-hover: #2a2a2a;
            --text: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 15px 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }

        .search-box {
            position: relative;
            width: 350px;
            max-width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
        }

        .hero {
            margin-top: 70px;
            padding: 60px 20px;
            background: linear-gradient(to bottom, rgba(15,15,15,0.8), var(--dark)),
                        url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1920') center/cover;
            min-height: 400px;
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-badge {
            display: inline-block;
            background: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(229,9,20,0.4);
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i { color: var(--primary); }

        .filter-tabs {
            display: flex;
            gap: 10px;
        }

        .filter-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-tab:hover, .filter-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .movie-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(229,9,20,0.3);
        }

        .movie-poster {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .movie-card:hover .movie-poster img {
            transform: scale(1.1);
        }

        .movie-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-card:hover .movie-overlay {
            opacity: 1;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(229,9,20,0.5);
        }

        .movie-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 2;
        }

        .movie-badge.series {
            background: #f59e0b;
        }

        .movie-rating {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            flex-direction: column;
            gap: 20px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(229,9,20,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-box {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .error-box i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .error-box button {
            margin-top: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: var(--card);
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            margin-top: 20px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.7);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
        }

        .modal-hero {
            position: relative;
            height: 350px;
            overflow: hidden;
            border-radius: 20px 20px 0 0;
        }

        .modal-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--card) 0%, transparent 70%);
        }

        .modal-body {
            padding: 30px;
            margin-top: -80px;
            position: relative;
            z-index: 1;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .modal-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .modal-meta .rating {
            color: #fbbf24;
            font-weight: 700;
        }

        .modal-description {
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .genre-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .genre-tag {
            padding: 6px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .cast-section { margin-bottom: 25px; }
        .cast-section h3 { margin-bottom: 15px; font-size: 1.1rem; }

        .cast-grid {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .cast-card {
            flex-shrink: 0;
            text-align: center;
            width: 70px;
        }

        .cast-card img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 8px;
        }

        .cast-card .name {
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cast-card .character {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .download-section {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .download-section h3 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text);
        }

        .download-link:hover {
            background: rgba(229,9,20,0.1);
            border-color: rgba(229,9,20,0.3);
            transform: translateX(5px);
        }

        .download-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quality-badge {
            background: var(--primary);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .file-size {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .download-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .footer {
            background: var(--darker);
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .footer p { color: var(--text-muted); font-size: 0.9rem; }
        .footer a { color: var(--primary); text-decoration: none; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateX(400px);
            transition: transform 0.4s;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show { transform: translateX(0); }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
            .modal-title { font-size: 1.5rem; }
            .search-box { width: 200px; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="#" class="logo" onclick="location.reload()">
                <i class="fas fa-film"></i>
                <span>DarkShan Movies</span>
            </a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="handleSearch(event)">
                <button onclick="searchMovies()"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <span class="hero-badge"><i class="fas fa-fire"></i> Trending Now</span>
            <h1>Unlimited Movies & TV Shows</h1>
            <p>Watch the latest movies and TV series for free. High quality streaming with multiple download options.</p>
            <button class="btn btn-primary" onclick="scrollToMovies()">
                <i class="fas fa-play"></i> Browse Now
            </button>
        </div>
    </section>

    <main class="main-content" id="mainContent">
        <div class="section-header">
            <h2 class="section-title">
                <i class="fas fa-compact-disc"></i>
                <span id="sectionTitle">Latest Movies</span>
            </h2>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterByType('all')">All</button>
                <button class="filter-tab" onclick="filterByType(1)">Movies</button>
                <button class="filter-tab" onclick="filterByType(2)">Series</button>
            </div>
        </div>

        <div id="moviesContainer">
            <div class="loading-container">
                <div class="loader"></div>
                <p>Loading movies from API...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Made with <i class="fas fa-heart" style="color: var(--primary);"></i> by <a href="#">@darkshanyt1</a></p>
    </footer>

    <div class="modal" id="movieModal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Done!</span>
    </div>

    <script>
        const API_KEY = '11d0642e3811dd1b';
        const BASE_URL = 'https://api-dark-shan-yt.koyeb.app/movie';
        
        let allMovies = [];
        let currentFilter = 'all';

        // Use a CORS proxy to bypass browser restrictions
        // You can replace this with your own proxy if needed
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        
        async function apiCall(endpoint) {
            const url = `${BASE_URL}${endpoint}&apikey=${API_KEY}`;
            // Try direct first, then proxy if it fails
            try {
                const response = await fetch(url);
                if (response.ok) return await response.json();
                throw new Error('Direct fetch failed');
            } catch (e) {
                // Fallback: try with proxy
                const proxyUrl = CORS_PROXY + encodeURIComponent(url);
                const response = await fetch(proxyUrl);
                return await response.json();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMovies();
        });

        async function fetchMovies() {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = `
                <div class="loading-container">
                    <div class="loader"></div>
                    <p>Connecting to API...</p>
                </div>
            `;

            try {
                const data = await apiCall('/moviepro-search?q=avatar');
                
                if (data.status && data.data && data.data.length > 0) {
                    allMovies = data.data;
                    renderMovies(allMovies);
                    showToast(`Loaded ${allMovies.length} movies!`);
                } else {
                    showError('No movies found in API response');
                }
            } catch (error) {
                console.error('API Error:', error);
                showError('Failed to connect to API. Check console for details.');
            }
        }

        async function searchMovies() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                renderMovies(allMovies);
                document.getElementById('sectionTitle').textContent = 'Latest Movies';
                return;
            }

            const container = document.getElementById('moviesContainer');
            container.innerHTML = `
                <div class="loading-container">
                    <div class="loader"></div>
                    <p>Searching for "${query}"...</p>
                </div>
            `;

            try {
                const data = await apiCall(`/moviepro-search?q=${encodeURIComponent(query)}`);
                
                if (data.status && data.data && data.data.length > 0) {
                    document.getElementById('sectionTitle').textContent = `Results: "${query}"`;
                    renderMovies(data.data);
                } else {
                    container.innerHTML = `
                        <div class="error-box">
                            <i class="fas fa-search"></i>
                            <h3>No movies found for "${query}"</h3>
                            <p>Try a different search term</p>
                        </div>
                    `;
                }
            } catch (error) {
                showError('Search failed. Please try again.');
            }
        }

        function handleSearch(e) {
            if (e.key === 'Enter') searchMovies();
        }

        function filterByType(type) {
            currentFilter = type;
            
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
                const text = tab.textContent.toLowerCase();
                if (type === 'all' && text === 'all') tab.classList.add('active');
                else if (type === 1 && text === 'movies') tab.classList.add('active');
                else if (type === 2 && text === 'series') tab.classList.add('active');
            });

            if (type === 'all') {
                document.getElementById('sectionTitle').textContent = 'Latest Movies';
                renderMovies(allMovies);
            } else {
                const filtered = allMovies.filter(m => m.type === type);
                document.getElementById('sectionTitle').textContent = type === 1 ? 'Movies' : 'TV Series';
                renderMovies(filtered);
            }
        }

        function renderMovies(movies) {
            const container = document.getElementById('moviesContainer');
            
            if (!movies || movies.length === 0) {
                container.innerHTML = `
                    <div class="error-box">
                        <i class="fas fa-film"></i>
                        <h3>No movies to display</h3>
                    </div>
                `;
                return;
            }

            container.innerHTML = movies.map(movie => `
                <div class="movie-card" onclick="showMovieDetails('${movie.id}')">
                    <div class="movie-poster">
                        <img src="${movie.image}" alt="${movie.title}" loading="lazy" 
                             onerror="this.src='https://via.placeholder.com/300x450/1a1a1a/666?text=No+Image'">
                        <span class="movie-badge ${movie.type === 2 ? 'series' : ''}">
                            ${movie.type === 1 ? 'MOVIE' : 'SERIES'}
                        </span>
                        <span class="movie-rating">
                            <i class="fas fa-star"></i> ${movie.rating || 'N/A'}
                        </span>
                        <div class="movie-overlay">
                            <div class="play-btn"><i class="fas fa-play"></i></div>
                        </div>
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <span><i class="fas fa-calendar"></i> ${movie.date ? movie.date.split('-')[0] : 'N/A'}</span>
                            <span><i class="fas fa-globe"></i> ${movie.country || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function showMovieDetails(movieId) {
            const modal = document.getElementById('movieModal');
            const content = document.getElementById('modalContent');
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            content.innerHTML = `
                <div class="loading-container" style="padding: 60px;">
                    <div class="loader"></div>
                    <p>Loading movie details...</p>
                </div>
            `;

            try {
                const data = await apiCall(`/moviepro-info?id=${movieId}`);
                
                if (data.status && data.data) {
                    renderModalContent(data.data);
                } else {
                    throw new Error('Invalid response');
                }
            } catch (error) {
                content.innerHTML = `
                    <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
                    <div class="error-box" style="padding: 60px;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Failed to load details</h3>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="showMovieDetails('${movieId}')">
                            <i class="fas fa-redo"></i> Retry
                        </button>
                    </div>
                `;
            }
        }

        function renderModalContent(movie) {
            const content = document.getElementById('modalContent');
            const duration = movie.duration ? formatDuration(movie.duration) : 'N/A';
            const typeLabel = movie.type === 1 ? 'Movie' : 'TV Series';
            
            content.innerHTML = `
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
                
                <div class="modal-hero">
                    <img src="${movie.image}" alt="${movie.title}" 
                         onerror="this.src='https://via.placeholder.com/900x400/1a1a1a/666?text=No+Image'">
                </div>
                
                <div class="modal-body">
                    <span class="hero-badge">${typeLabel}</span>
                    <h1 class="modal-title">${movie.title}</h1>
                    
                    <div class="modal-meta">
                        <span class="rating"><i class="fas fa-star"></i> ${movie.rating || 'N/A'}</span>
                        <span><i class="fas fa-calendar"></i> ${movie.date || 'N/A'}</span>
                        <span><i class="fas fa-clock"></i> ${duration}</span>
                        <span><i class="fas fa-globe"></i> ${movie.country || 'N/A'}</span>
                    </div>

                    <div class="genre-tags">
                        ${movie.genre ? movie.genre.map(g => `<span class="genre-tag">${g}</span>`).join('') : ''}
                    </div>

                    <p class="modal-description">${movie.description || 'No description available.'}</p>

                    ${movie.cast && movie.cast.length > 0 ? `
                        <div class="cast-section">
                            <h3><i class="fas fa-users"></i> Cast</h3>
                            <div class="cast-grid">
                                ${movie.cast.map(c => `
                                    <div class="cast-card">
                                        <img src="${c.url || 'https://via.placeholder.com/80'}" alt="${c.name}"
                                             onerror="this.src='https://via.placeholder.com/80/1a1a1a/666?text=?'">
                                        <div class="name">${c.name}</div>
                                        <div class="character">${c.character}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${movie.download && movie.download.length > 0 ? `
                        <div class="download-section">
                            <h3><i class="fas fa-download"></i> Download Links</h3>
                            <div class="download-links">
                                ${movie.download.map(d => `
                                    <a href="${d.link}" target="_blank" class="download-link" 
                                       onclick="showToast('Opening download: ${d.quality}')">
                                        <div class="download-info">
                                            <span class="quality-badge">${d.quality}</span>
                                            <span class="file-size"><i class="fas fa-file-video"></i> ${d.size}</span>
                                        </div>
                                        <button class="download-btn"><i class="fas fa-download"></i> Download</button>
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    ` : `
                        <div class="download-section">
                            <h3><i class="fas fa-download"></i> Download Links</h3>
                            <p style="color: var(--text-muted); text-align: center; padding: 20px;">
                                <i class="fas fa-exclamation-circle" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                                No download links available.
                            </p>
                        </div>
                    `}

                    ${movie.subtitles && movie.subtitles.length > 0 ? `
                        <div style="margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 12px;">
                            <h3 style="margin-bottom: 15px;"><i class="fas fa-closed-captioning"></i> Subtitles</h3>
                            <div class="genre-tags">
                                ${movie.subtitles.map(s => `
                                    <span class="genre-tag"><i class="fas fa-language"></i> ${s.language}</span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('movieModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function formatDuration(seconds) {
            if (!seconds || seconds === 0) return 'N/A';
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            return hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showError(message) {
            document.getElementById('moviesContainer').innerHTML = `
                <div class="error-box">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>${message}</h3>
                    <p>Make sure you have internet connection and the API is accessible.</p>
                    <button class="btn btn-primary" onclick="fetchMovies()">
                        <i class="fas fa-redo"></i> Try Again
                    </button>
                </div>
            `;
        }

        function scrollToMovies() {
            document.getElementById('mainContent').scrollIntoView({ behavior: 'smooth' });
        }

        // Close modal on outside click
        document.getElementById('movieModal').addEventListener('click', (e) => {
            if (e.target.id === 'movieModal') closeModal();
        });

        // Close modal on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
