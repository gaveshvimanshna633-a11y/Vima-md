  }
  .search-box i { color: var(--accent-color); margin-right: 8px; }
  
  .admin-btn {

  }
  .admin-btn:hover {
    background: var(--accent-color); color: #000; box-shadow: 0 0 15px var(--accent-color);
  }

  /* Hero Slider */
  .hero {
    height: 75vh; position: relative; margin-top: 70px;
    background-size: cover; background-position: center;
    display: flex; align-items: center; padding: 0 5%;
    transition: background-image 0.5s ease-in-out;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;

  }
  .hero-content { position: relative; z-index: 2; max-width: 600px; }

  .hero-btn {
    background: var(--accent-color); color: #000; padding: 10px 25px;

    transition: 0.3s; border: none; cursor: pointer;
  }
  .hero-btn:hover { background: var(--accent-hover); box-shadow: 0 0 25px var(--accent-hover); transform: translateY(-2px); }

  /* Main Content Layout */
  .container { padding: 40px 5%; }

    font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700;

    border-left: 4px solid var(--accent-color); padding-left: 10px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  
  /* Movie Grid */
  .movie-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px; margin-bottom: 40px;
  }
  .movie-card {
    background: var(--card-bg); border-radius: 12px; overflow: hidden;
    position: relative; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255,255,255,0.03);
  }
  .movie-card:hover {
    transform: translateY(-8px); border-color: rgba(0,210,255,0.4);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 12px rgba(0,210,255,0.1);
  }
  .card-img-wrapper { position: relative; aspect-ratio: 2/3; width: 100%; overflow: hidden; }

  .movie-card:hover .card-img-wrapper img { transform: scale(1.05); }
  
  .card-quality {
    position: absolute; top: 8px; left: 8px; background: var(--accent-color);

  }
  .card-rating {

  }

  .details-plot { color: var(--text-muted); font-size: 14.5px; line-height: 1.7; margin-bottom: 20px; }
