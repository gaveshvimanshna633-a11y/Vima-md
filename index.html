<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Story - Cloud Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #050505; min-height: 100vh; color: #fff; overflow-x: hidden; }

        /* ===== ANIMATED BG ORBS ===== */
        .bg-animation { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:hidden; }
        .bg-orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:0.06; animation:orbFloat 12s ease-in-out infinite; }
        .bg-orb:nth-child(1){width:500px;height:500px;background:#cc0000;top:-150px;left:-150px;animation-delay:0s;}
        .bg-orb:nth-child(2){width:400px;height:400px;background:#880000;bottom:-100px;right:-100px;animation-delay:-4s;}
        .bg-orb:nth-child(3){width:300px;height:300px;background:#ff4d4d;top:40%;left:50%;animation-delay:-8s;}
        @keyframes orbFloat { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(30px,-30px) scale(1.05);} 66%{transform:translate(-20px,20px) scale(0.97);} }

        /* ===== PARTICLES & SNOW ===== */
        .particles-container, .snow-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:hidden; }
        .particle { position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(255,77,77,0.5), transparent); animation:particleDrift linear infinite; }
        .snowflake { position:absolute; top:-10px; color:rgba(255,255,255,0.5); animation:fall linear infinite; }
        @keyframes particleDrift { 0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0;} 10%{opacity:1;} 90%{opacity:0.4;} 100%{transform:translateY(-10vh) translateX(var(--drift)) scale(1);opacity:0;} }
        @keyframes fall { 0%{transform:translateY(-10px) rotate(0deg);opacity:1;} 100%{transform:translateY(100vh) rotate(360deg);opacity:0.1;} }

        /* ===== SIDEBAR & USER UI ===== */
        .sidebar { position:fixed; top:0; left:-350px; width:350px; height:100vh; background:linear-gradient(180deg,#1a0000 0%,#0d0000 100%); z-index:1002; transition:left 0.4s cubic-bezier(0.4,0,0.2,1); box-shadow:5px 0 30px rgba(0,0,0,0.8); overflow-y:auto; border-right:1px solid rgba(204,0,0,0.2); }
        .sidebar.active { left:0; }
        .sidebar-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1001; opacity:0; visibility:hidden; transition:0.3s; }
        .sidebar-overlay.active { opacity:1; visibility:visible; }
        
        .user-section { padding: 30px 25px; text-align: center; background: rgba(204,0,0,0.05); border-bottom: 1px solid rgba(204,0,0,0.1); }
        .user-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #cc0000; margin-bottom: 12px; object-fit: cover; box-shadow: 0 0 15px rgba(204,0,0,0.3); }
        .user-no-img { font-size: 3.5rem; color: #333; margin-bottom: 12px; }
        .user-name { font-weight: 700; color: #fff; font-size: 1.1rem; }
        .user-email { font-size: 0.8rem; color: #cc6666; margin-bottom: 15px; }

        .auth-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-family: 'Poppins'; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .login-btn { background: #fff; color: #000; }
        .logout-btn { background: rgba(255,255,255,0.05); color: #ff4d4d; border: 1px solid rgba(204,0,0,0.2); margin-top: 10px; }

        /* ===== HEADER & GRID (Original Styles) ===== */
        .header { text-align:center; padding:60px 20px 25px; position:relative; z-index:10; }
        .logo { font-size:3rem; font-weight:700; background:linear-gradient(135deg,#ff4d4d,#cc0000); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .menu-btn { position:fixed; top:20px; left:20px; width:48px; height:48px; background:linear-gradient(135deg,#cc0000,#990000); border:none; border-radius:12px; color:#fff; cursor:pointer; z-index:1001; box-shadow:0 4px 15px rgba(204,0,0,0.4); }
        .wallpaper-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 20px; max-width:600px; margin:0 auto; position:relative; z-index:5; }
        .wallpaper-card { border-radius:20px; overflow:hidden; background:#111; position:relative; cursor:pointer; transition:0.3s; }
        .wallpaper-card:nth-child(even) { margin-top:20px; }
        .wallpaper-card img { width:100%; object-fit:cover; display:block; }
        
        .filter-container { display:flex; gap:10px; padding:20px; overflow-x:auto; scrollbar-width:none; justify-content: center; }
        .filter-btn { padding:8px 20px; background:rgba(255,255,255,0.05); border:1px solid rgba(204,0,0,0.3); border-radius:20px; color:#ff9999; cursor:pointer; white-space:nowrap; }
        .filter-btn.active { background:#cc0000; color:#fff; }

        .toast { position:fixed; bottom:25px; left:50%; transform:translateX(-50%) translateY(100px); background:#cc0000; color:#fff; padding:12px 24px; border-radius:25px; z-index:5000; transition:0.4s; opacity:0; box-shadow: 0 5px 15px rgba(204,0,0,0.3); }
        .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

        @media(max-width:480px){.logo{font-size:2rem;}.wallpaper-grid{grid-template-columns:1fr 1fr;}}
    </style>
</head>
<body>

<div class="bg-animation"><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div></div>
<div class="particles-container" id="particlesContainer"></div>
<div class="snow-container" id="snowContainer"></div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
    <div class="user-section" id="userSection">
        <div id="authContent">
            <i class="fas fa-user-circle user-no-img"></i>
            <p style="font-size: 0.85rem; margin-bottom: 15px; color: #cc6666;">Sign in to sync your story</p>
            <button class="auth-btn login-btn" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google Login
            </button>
        </div>
    </div>

    <div style="padding: 25px;">
        <div style="color: #ff4d4d; font-size: 0.9rem; font-weight: 600; margin-bottom: 15px;"><i class="fas fa-code"></i> Developers</div>
        <p style="font-size: 0.85rem; color: #cc6666; margin-bottom: 5px;">Gavesh Vimanshana</p>
        <p style="font-size: 0.85rem; color: #cc6666;">P Kaveesha</p>
    </div>
</aside>

<button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>

<header class="header">
    <h1 class="logo">Wallpaper Story</h1>
    <p style="color: #ff9999; font-size: 0.9rem;">High quality wallpapers for you</p>
</header>

<section class="filter-section">
    <div class="filter-container">
        <button class="filter-btn active">✦ All</button>
        <button class="filter-btn">🌿 Nature</button>
        <button class="filter-btn">⚡ Anime</button>
        <button class="filter-btn">🚗 Cars</button>
    </div>
</section>

<main class="wallpaper-grid" id="wallpaperGrid"></main>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage"></span></div>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBI-A1vwTeYaD-z6CeYAQ2IdQ3m_GXyA8M",
  authDomain: "wallpaper-8f90c.firebaseapp.com",
  projectId: "wallpaper-8f90c",
  storageBucket: "wallpaper-8f90c.firebasestorage.app",
  messagingSenderId: "1066530041230",
  appId: "1:1066530041230:web:51f35f2471c31e348808df",
  measurementId: "G-0PEF2WCBJE"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

// ===== AUTH LOGIC =====
function loginWithGoogle() {
    auth.signInWithPopup(provider).then((result) => {
        showToast("Welcome " + result.user.displayName);
    }).catch((err) => { showToast("Login Error!"); console.log(err); });
}

function logout() {
    auth.signOut().then(() => showToast("Logged Out"));
}

function updateProfileUI(user) {
    const authContent = document.getElementById('authContent');
    if (user) {
        authContent.innerHTML = `
            <img src="${user.photoURL}" class="user-img" alt="Profile">
            <div class="user-name">${user.displayName}</div>
            <div class="user-email">${user.email}</div>
            <button class="auth-btn logout-btn" onclick="logout()">Logout</button>
        `;
    } else {
        authContent.innerHTML = `
            <i class="fas fa-user-circle user-no-img"></i>
            <p style="font-size: 0.85rem; margin-bottom: 15px; color: #cc6666;">Sign in to sync your story</p>
            <button class="auth-btn login-btn" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google Login
            </button>
        `;
    }
}

auth.onAuthStateChanged(user => updateProfileUI(user));

// ===== WALLPAPER DATA & RENDER =====
const wallpapers = [
    {id:1,title:"Jellyfish Glow",url:"https://images.unsplash.com/photo-1546026423-cc4642628d2b?w=800",h:"320px"},
    {id:2,title:"Autumn Forest",url:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800",h:"260px"},
    {id:3,title:"Cyber City",url:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=800",h:"260px"},
    {id:4,title:"Supercar",url:"https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=800",h:"320px"},
    {id:5,title:"Dark Mountain",url:"https://images.unsplash.com/photo-1511497584788-876760111969?w=800",h:"260px"},
    {id:6,title:"Abstract Art",url:"https://images.unsplash.com/photo-1550684376-efcbd6e3f031?w=800",h:"260px"}
];

function renderWallpapers() {
    const grid = document.getElementById('wallpaperGrid');
    grid.innerHTML = wallpapers.map(w => `
        <div class="wallpaper-card">
            <img src="${w.url}" style="height:${w.h}">
            <div style="padding:12px; font-size:0.85rem; font-weight:500;">${w.title}</div>
        </div>
    `).join('');
}

// ===== EFFECTS (Snow, Particles, Sidebar) =====
function createSnow(){const c=document.getElementById('snowContainer');for(let i=0;i<30;i++){const f=document.createElement('div');f.className='snowflake';f.innerHTML='&#10052;';f.style.cssText=`left:${Math.random()*100}%;animation-duration:${Math.random()*5+5}s;animation-delay:${Math.random()*5}s;font-size:${Math.random()*10+5}px;`;c.appendChild(f);}}
function createParticles(){const c=document.getElementById('particlesContainer');for(let i=0;i<20;i++){const p=document.createElement('div');const sz=Math.random()*5+2;p.className='particle';p.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;animation-duration:${Math.random()*10+10}s;--drift:${(Math.random()-0.5)*150}px`;c.appendChild(p);}}

const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebarOverlay');
document.getElementById('menuBtn').onclick = () => { sidebar.classList.add('active'); overlay.classList.add('active'); };
overlay.onclick = () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); };

function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMessage').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

document.addEventListener('DOMContentLoaded', () => {
    renderWallpapers();
    createSnow();
    createParticles();
});
</script>
</body>
</html>
